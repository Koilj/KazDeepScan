[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kazdeepscan"
version = "0.1.0"
description = "Risk assessment service for synthetic Russian and Kazakh speech"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "KazDeepScan" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "py7zr>=1,<2",
  "python-multipart>=0.0.20,<1",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.30,<1",
  "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
ml = [
  "torch>=2.7,<3",
  "torchaudio>=2.7,<3",
  "transformers>=4.48,<6",
]
synthesis = [
  "piper-tts==1.6.0",
]

[project.scripts]
kds = "kds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kds"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
