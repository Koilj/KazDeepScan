[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kazdeepscan"
version = "0.1.0"
description = "Audited personal-research workflows for synthetic Russian and Kazakh speech"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "KazDeepScan" }]
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "py7zr>=1,<2",
  "python-multipart>=0.0.20,<1",
  "soundfile>=0.13,<1",
  "uvicorn[standard]>=0.30,<1",
  "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]
ml = [
  "torch>=2.7,<3",
  "torchaudio>=2.7,<3",
  "transformers>=4.48,<6",
]
synthesis = [
  "piper-tts==1.6.0",
]
kazemotts = [
  "einops>=0.8,<1",
  "matplotlib>=3.9,<4",
  "Unidecode>=1.3,<2",
]
kazakhtts = [
  "espnet==0.10.6",
  "parallel-wavegan==0.6.1",
  "scipy>=1.15,<2",
  "sentencepiece>=0.2.1,<0.3",
  "typeguard>=2.13,<3",
]
sparktts = [
  "einx>=0.3,<1",
  "omegaconf>=2.3,<3",
  "safetensors>=0.5,<1",
  "tqdm>=4.66,<5",
]

[project.scripts]
kds = "kds.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kds"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv.extra-build-dependencies]
parallel-wavegan = ["pip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
